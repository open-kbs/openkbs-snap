<!doctype html>
<html><head><meta charset="utf-8"><title>OpenKBS Snap · microphone</title>
<link rel="stylesheet" href="ui.css">
<style>body{max-width:420px;margin:60px auto;padding:0 20px;display:flex;flex-direction:column;gap:14px}p{color:var(--muted)}</style>
</head><body>
  <div class="brand"><img src="icons/icon-32.png" alt=""><h1>Allow the microphone for dictation</h1></div>
  <p>OpenKBS Snap records only while you hold the mic button in the screenshot editor, and sends the clip to your connected project for transcription. Chrome asks once; the choice is remembered for this extension.</p>
  <button id="ask" class="btn btn-primary">Allow microphone</button>
  <div id="msg" class="msg"></div>
  <script src="mic-permission.js"></script>
</body></html>
